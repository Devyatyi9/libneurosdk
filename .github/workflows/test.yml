name: Build and Test

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        arch: [x64]
        include:
          - os: windows-latest
            arch: x86

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'pwsh' || 'bash' }}

    steps:
    - uses: actions/checkout@v7

    - name: Set up MSVC (Windows only)
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch == 'x86' && 'x86' || 'x64' }}

    - name: Install Python dependencies
      run: python -m pip install websockets

    - name: Configure CMake
      run: |
        cmake -B build -DNEURO_BUILD_TESTS=ON ${{ matrix.os == 'windows-latest' && (matrix.arch == 'x86' && '-A Win32' || format('-A {0}', matrix.arch)) || '' }}

    - name: Build
      run: cmake --build build --config Release

    - name: Run tests (integration + echo)
      run: |
        ${{ matrix.os == 'windows-latest' && 'Start-Process -NoNewWindow python -ArgumentList "tests/integration/echo_server.py 9002"' || 'python tests/integration/echo_server.py 9002 &' }}
        sleep 3
        ${{ matrix.os == 'windows-latest' && 'build\Release\integration_test.exe' || './build/integration_test' }} ws://127.0.0.1:9002/
        ${{ matrix.os == 'windows-latest' && 'build\Release\echo_test.exe' || './build/echo_test' }} ws://127.0.0.1:9002/

    - name: Autobahn fuzzingserver (Linux only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        mkdir -p reports
        docker run -d -p 9001:9001 \
          -v ${{ github.workspace }}/tests/autobahn:/config \
          -v ${{ github.workspace }}/reports:/reports \
          --name autobahn \
          crossbario/autobahn-testsuite \
          wstest -m fuzzingserver -s /config/fuzzingserver.json
        sleep 4

    - name: Run Autobahn test cases (Linux only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        for i in $(seq 1 247); do
          if ! ./build/fuzzing_client "$i" "ws://127.0.0.1:9001"; then
            echo "FAIL: case $i"
            exit 1
          fi
        done
        echo "Autobahn: 247/247 passed"

    - name: Trigger report finalisation
      if: matrix.os == 'ubuntu-latest'
      shell: python
      run: |
        import socket, base64, os
        s = socket.socket(); s.settimeout(10)
        s.connect(('127.0.0.1', 9001))
        k = base64.b64encode(os.urandom(16)).decode()
        req = ('GET /updateReports?agent=ws_client HTTP/1.1\r\n'
               'Host: 127.0.0.1:9001\r\n'
               'Upgrade: websocket\r\nConnection: Upgrade\r\n'
               'Sec-WebSocket-Key: ' + k + '\r\n'
               'Sec-WebSocket-Version: 13\r\n\r\n')
        s.send(req.encode()); s.recv(4096); s.close()

    - name: Check Autobahn reports (Linux only)
      if: matrix.os == 'ubuntu-latest'
      shell: python
      run: |
        import json, sys, os
        p = os.path.join('reports', 'index.json')
        if not os.path.exists(p):
            print('index.json not found')
            sys.exit(1)
        d = json.load(open(p))
        c = d[list(d.keys())[0]]
        f = [k for k, v in c.items() if v.get('behavior') in ('FAILED', 'NON-COMPLIANT', 'UNSTABLE')]
        if f:
            print(f'{len(f)} failures: {f}')
            sys.exit(1)
        else:
            print(f'{len(c)} cases, all passed')

    - name: Install and start Toxiproxy (Linux only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        wget -q https://github.com/Shopify/toxiproxy/releases/download/v2.12.0/toxiproxy-server-linux-amd64 -O /usr/local/bin/toxiproxy-server
        chmod +x /usr/local/bin/toxiproxy-server
        /usr/local/bin/toxiproxy-server &
        sleep 2

    - name: Run Toxiproxy × slicer (Linux only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        python tests/handshake/toxiproxy_test.py slicer pre ./build/echo_test
        python tests/handshake/toxiproxy_test.py latency pre ./build/echo_test
        python tests/handshake/toxiproxy_test.py timeout pre ./build/echo_test
        python tests/handshake/toxiproxy_test.py reset pre ./build/echo_test
        python tests/handshake/toxiproxy_test.py bandwidth pre ./build/echo_test

    - name: Run Toxiproxy × bad_handshake (Linux only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        python tests/handshake/bad_handshake_toxiproxy_test.py ./build/echo_test

    - name: Stop background servers
      if: always()
      run: |
        ${{ matrix.os == 'windows-latest' && 'Stop-Process -Name python -Force -ErrorAction SilentlyContinue' || 'pkill -f echo_server.py 2>/dev/null || true; pkill -f toxiproxy-server 2>/dev/null || true' }}

    - name: Stop Autobahn
      if: matrix.os == 'ubuntu-latest' && always()
      run: docker rm -f autobahn

  asan:
    name: ASan x86 (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@v7

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Install Python dependencies
      run: python -m pip install websockets

    - name: Configure CMake
      run: cmake -B build -A Win32 -DNEURO_BUILD_TESTS=ON -DNEURO_SANITIZE=ON

    - name: Build
      run: cmake --build build --config Release

    - name: Locate ASan DLL and add to PATH
      shell: pwsh
      run: |
        $v = $env:VCToolsVersion
        $pattern = "C:/Program Files/Microsoft Visual Studio/*/Enterprise/VC/Tools/MSVC/${v}/bin/Hostx64/x86/clang_rt.asan_dynamic-i386.dll"
        $dll = Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $dll) {
          $dll = Get-ChildItem -Path "C:/Program Files/Microsoft Visual Studio/*/Enterprise/VC/Tools/MSVC/*/bin/Hostx64/x86/clang_rt.asan_dynamic-i386.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
        }
        if (-not $dll) {
          $dll = Get-ChildItem -Path "C:/Program Files/Microsoft Visual Studio/*/Community/VC/Tools/MSVC/*/bin/Hostx64/x86/clang_rt.asan_dynamic-i386.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
        }
        if ($dll) {
          $dllDir = $dll.DirectoryName
          echo "ASan DLL found: $dllDir"
          echo "ASAN_DLL_DIR=$dllDir" | Out-File -FilePath $env:GITHUB_ENV -Append
        } else {
          echo "ASan DLL not found"
          exit 1
        }

    - name: Run tests (integration + echo + long-run)
      run: |
        $env:PATH = "$env:ASAN_DLL_DIR;$env:PATH"
        Start-Process -NoNewWindow python -ArgumentList "tests/integration/echo_server.py 9002"
        Start-Sleep 3
        build/Release/integration_test.exe ws://127.0.0.1:9002/
        build/Release/echo_test.exe ws://127.0.0.1:9002/
        python tests/perf/long_run.py ws://127.0.0.1:9002/ 0.083 30

    - name: Stop background servers
      if: always()
      run: Stop-Process -Name python -Force -ErrorAction SilentlyContinue
