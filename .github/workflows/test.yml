name: Build and Test

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        arch: [x64]
        include:
          - os: windows-latest
            arch: x86

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'pwsh' || 'bash' }}

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: |
        cmake -B build -DNEURO_BUILD_TESTS=ON ${{ matrix.os == 'windows-latest' && (matrix.arch == 'x86' && '-A Win32' || format('-A {0}', matrix.arch)) || '' }}

    - name: Build
      run: cmake --build build --config Release

    - name: Run integration tests
      run: |
        ${{ matrix.os == 'windows-latest' && 'Start-Process -NoNewWindow python -ArgumentList "tests/integration/echo_server.py 9002"' || 'python tests/integration/echo_server.py 9002 &' }}
        sleep 3
        ${{ matrix.os == 'windows-latest' && 'build\Release\integration_test.exe' || './build/integration_test' }} ws://127.0.0.1:9002/

    - name: Run echo_test
      run: |
        ${{ matrix.os == 'windows-latest' && 'build\Release\echo_test.exe' || './build/echo_test' }} ws://127.0.0.1:9002/

    - name: Autobahn fuzzingserver (Linux only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        mkdir -p reports
        docker run -d -p 9001:9001 \
          -v ${{ github.workspace }}/tests/autobahn:/config \
          -v ${{ github.workspace }}/reports:/reports \
          --name autobahn \
          crossbario/autobahn-testsuite \
          wstest -m fuzzingserver -s /config/fuzzingserver.json
        sleep 4

    - name: Run Autobahn test cases (Linux only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        for i in $(seq 1 247); do
          if ! ./build/fuzzing_client "$i" "ws://127.0.0.1:9001"; then
            echo "FAIL: case $i"
            exit 1
          fi
        done
        echo "Autobahn: 247/247 passed"

    - name: Trigger report finalisation
      if: matrix.os == 'ubuntu-latest'
      run: |
        python3 -c "
import socket, base64, os
s = socket.socket()
s.settimeout(10)
s.connect(('127.0.0.1', 9001))
key = base64.b64encode(os.urandom(16)).decode()
req = f'GET /updateReports?agent=ws_client HTTP/1.1\r\nHost: 127.0.0.1:9001\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: {key}\r\nSec-WebSocket-Version: 13\r\n\r\n'
s.send(req.encode())
s.recv(4096)
s.close()
"

    - name: Check Autobahn reports (Linux only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        python3 -c "
import json, sys, os
path = os.path.join('reports', 'index.json')
if not os.path.exists(path):
    print('index.json not found — reports not generated')
    sys.exit(1)
with open(path) as f:
    data = json.load(f)
agent = list(data.keys())[0]
cases = data[agent]
failed = [k for k,v in cases.items() if v.get('behavior') in ('FAILED','NON-COMPLIANT','UNSTABLE')]
if failed:
    print(f'{len(failed)} failures: {failed}')
    sys.exit(1)
else:
    print(f'{len(cases)} cases, all passed')
print('Autobahn: OK')
"

    - name: Install Toxiproxy (Linux only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        wget -q https://github.com/Shopify/toxiproxy/releases/download/v2.12.0/toxiproxy-server-linux-amd64 -O /usr/local/bin/toxiproxy-server
        chmod +x /usr/local/bin/toxiproxy-server

    - name: Run Toxiproxy × slicer (Linux only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        python tests/handshake/toxiproxy_test.py slicer pre ./build/echo_test
        python tests/handshake/toxiproxy_test.py latency pre ./build/echo_test
        python tests/handshake/toxiproxy_test.py timeout pre ./build/echo_test
        python tests/handshake/toxiproxy_test.py reset pre ./build/echo_test
        python tests/handshake/toxiproxy_test.py bandwidth pre ./build/echo_test

    - name: Run Toxiproxy × bad_handshake (Linux only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        python tests/handshake/bad_handshake_toxiproxy_test.py ./build/echo_test

    - name: Stop Autobahn
      if: matrix.os == 'ubuntu-latest' && always()
      run: docker rm -f autobahn

  asan:
    name: ASan x86 (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -A Win32 -DNEURO_BUILD_TESTS=ON -DNEURO_SANITIZE=ON

    - name: Build
      run: cmake --build build --config Release

    - name: Locate ASan DLL and add to PATH
      shell: pwsh
      run: |
        $msvcRoot = "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Tools/MSVC"
        $dll = Get-ChildItem -Recurse -Filter "clang_rt.asan_dynamic-i386.dll" -Path $msvcRoot | Select-Object -First 1
        if (-not $dll) {
          $msvcRoot = "C:/Program Files/Microsoft Visual Studio/2022/Community/VC/Tools/MSVC"
          $dll = Get-ChildItem -Recurse -Filter "clang_rt.asan_dynamic-i386.dll" -Path $msvcRoot | Select-Object -First 1
        }
        if ($dll) {
          $dllDir = $dll.DirectoryName
          echo "ASan DLL found: $dllDir"
          echo "ASAN_DLL_DIR=$dllDir" | Out-File -FilePath $env:GITHUB_ENV -Append
        } else {
          echo "ASan DLL not found"
          exit 1
        }

    - name: Run integration tests
      run: |
        $env:PATH = "$env:ASAN_DLL_DIR;$env:PATH"
        Start-Process -NoNewWindow python -ArgumentList "tests/integration/echo_server.py 9002"
        Start-Sleep 3
        build/Release/integration_test.exe ws://127.0.0.1:9002/

    - name: Run echo_test
      run: |
        $env:PATH = "$env:ASAN_DLL_DIR;$env:PATH"
        build/Release/echo_test.exe ws://127.0.0.1:9002/

    - name: Long-run leak detection (5 min)
      run: |
        $env:PATH = "$env:ASAN_DLL_DIR;$env:PATH"
        python tests/perf/long_run.py ws://127.0.0.1:9002/ 0.083 30
