name: Build and Test

on:
  workflow_dispatch:
  #push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} ${{ matrix.arch }}${{ matrix.asan && ' ASan' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            asan: false
          - os: ubuntu-latest
            arch: x64
            asan: true
          - os: macos-latest
            arch: arm64
            asan: false
          - os: macos-latest
            arch: arm64
            asan: true
          - os: windows-latest
            arch: x64
            asan: false
          - os: windows-latest
            arch: x64
            asan: true
          - os: windows-latest
            arch: x86
            asan: false
          - os: windows-latest
            arch: x86
            asan: true

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'pwsh' || 'bash' }}

    steps:
    - uses: actions/checkout@v7

    - name: Set up MSVC (Windows only)
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch }}

    - name: Install Python dependencies
      run: python -m pip install websockets

    - name: Configure CMake
      env:
        CC: ${{ matrix.os == 'ubuntu-latest' && 'clang' || '' }}
        CXX: ${{ matrix.os == 'ubuntu-latest' && 'clang++' || '' }}
      run: |
        cmake -B build -DNEURO_BUILD_TESTS=ON ${{ matrix.asan && '-DNEURO_SANITIZE=ON' || '' }} ${{ matrix.os == 'windows-latest' && (matrix.arch == 'x86' && '-A Win32' || format('-A {0}', matrix.arch)) || '' }}

    - name: Build
      run: cmake --build build --config Release

    - name: Locate ASan DLL
      if: matrix.os == 'windows-latest' && matrix.asan
      shell: pwsh
      run: |
        $dllName = '${{ matrix.arch }}' -eq 'x86' ? 'clang_rt.asan_dynamic-i386.dll' : 'clang_rt.asan_dynamic-x86_64.dll'
        $v = $env:VCToolsVersion
        $pattern = "C:/Program Files/Microsoft Visual Studio/*/Enterprise/VC/Tools/MSVC/${v}/bin/Hostx64/${{ matrix.arch }}/${dllName}"
        $dll = Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $dll) {
          $dll = Get-ChildItem -Path "C:/Program Files/Microsoft Visual Studio/*/*/VC/Tools/MSVC/*/bin/Hostx64/${{ matrix.arch }}/${dllName}" -ErrorAction SilentlyContinue | Select-Object -First 1
        }
        if (-not $dll) {
          $dll = Get-ChildItem -Path "C:/Program Files/Microsoft Visual Studio/*/Community/VC/Tools/MSVC/*/bin/Hostx64/${{ matrix.arch }}/${dllName}" -ErrorAction SilentlyContinue | Select-Object -First 1
        }
        if ($dll) {
          echo "ASAN_DLL_DIR=$($dll.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append
        } else {
          echo "ASan DLL not found"
          exit 1
        }

    - name: Run tests (integration + echo)
      run: |
        ${{ matrix.os == 'windows-latest' && 'Start-Process -NoNewWindow python -ArgumentList "tests/integration/echo_server.py 9002"' || 'python tests/integration/echo_server.py 9002 &' }}
        sleep 3
        ${{ matrix.os == 'windows-latest' && 'build/Release/integration_test.exe' || './build/integration_test' }} ws://127.0.0.1:9002/
        ${{ matrix.os == 'windows-latest' && 'build/Release/echo_test.exe' || './build/echo_test' }} ws://127.0.0.1:9002/
        ${{ matrix.asan && 'python tests/perf/long_run.py ws://127.0.0.1:9002/ 0.083 30' || '' }}

    - name: Stalled TCP test (listen-only server)
      run: |
        python tests/handshake/listen_only_test.py ${{ matrix.os == 'windows-latest' && 'build/Release/echo_test.exe' || './build/echo_test' }}

    - name: Autobahn fuzzingserver (Linux only)
      if: matrix.os == 'ubuntu-latest' && matrix.asan
      run: |
        mkdir -p reports
        docker run -d -p 9001:9001 \
          -v ${{ github.workspace }}/tests/autobahn:/config \
          -v ${{ github.workspace }}/reports:/reports \
          --name autobahn \
          crossbario/autobahn-testsuite \
          wstest -m fuzzingserver -s /config/fuzzingserver.json
        sleep 4

    - name: Run Autobahn test cases (Linux only)
      if: matrix.os == 'ubuntu-latest' && matrix.asan
      run: |
        for i in $(seq 1 247); do
          if ! ./build/fuzzing_client "$i" "ws://127.0.0.1:9001"; then
            echo "FAIL: case $i"
            exit 1
          fi
        done
        echo "Autobahn: 247/247 passed"

    - name: Trigger report finalisation
      if: matrix.os == 'ubuntu-latest' && matrix.asan
      shell: python
      run: |
        import socket, base64, os
        s = socket.socket(); s.settimeout(10)
        s.connect(('127.0.0.1', 9001))
        k = base64.b64encode(os.urandom(16)).decode()
        req = ('GET /updateReports?agent=ws_client HTTP/1.1\r\n'
               'Host: 127.0.0.1:9001\r\n'
               'Upgrade: websocket\r\nConnection: Upgrade\r\n'
               'Sec-WebSocket-Key: ' + k + '\r\n'
               'Sec-WebSocket-Version: 13\r\n\r\n')
        s.send(req.encode()); s.recv(4096); s.close()

    - name: Check Autobahn reports (Linux only)
      if: matrix.os == 'ubuntu-latest' && matrix.asan
      shell: python
      run: |
        import json, sys, os
        p = os.path.join('reports', 'index.json')
        if not os.path.exists(p):
            print('index.json not found')
            sys.exit(1)
        d = json.load(open(p))
        c = d[list(d.keys())[0]]
        f = [k for k, v in c.items() if v.get('behavior') in ('FAILED', 'NON-COMPLIANT', 'UNSTABLE')]
        if f:
            print(f'{len(f)} failures: {f}')
            sys.exit(1)
        else:
            print(f'{len(c)} cases, all passed')

    - name: Install and start Toxiproxy
      if: matrix.asan
      run: |
        ${{ matrix.os == 'ubuntu-latest' && 'wget -q https://github.com/Shopify/toxiproxy/releases/download/v2.12.0/toxiproxy-server-linux-amd64 -O /tmp/toxiproxy-server && chmod +x /tmp/toxiproxy-server' || '' }}
        ${{ matrix.os == 'macos-latest' && 'curl -sL https://github.com/Shopify/toxiproxy/releases/download/v2.12.0/toxiproxy-server-darwin-arm64 -o /tmp/toxiproxy-server && chmod +x /tmp/toxiproxy-server' || '' }}
        ${{ matrix.os == 'windows-latest' && 'New-Item -ItemType Directory -Path "$env:ProgramData\toxiproxy" -Force -ErrorAction SilentlyContinue | Out-Null; curl.exe -sL https://github.com/Shopify/toxiproxy/releases/download/v2.12.0/toxiproxy-server-windows-amd64.exe -o "$env:ProgramData\toxiproxy\toxiproxy-server.exe"' || '' }}
        ${{ matrix.os == 'windows-latest' && 'Start-Process -NoNewWindow -FilePath "$env:ProgramData\toxiproxy\toxiproxy-server.exe"' || '/tmp/toxiproxy-server &' }}
        sleep 2

    - name: Run Toxiproxy tests
      if: matrix.asan
      run: |
        python tests/handshake/toxiproxy_test.py slicer pre ${{ matrix.os == 'windows-latest' && 'build/Release/echo_test.exe' || './build/echo_test' }}
        python tests/handshake/toxiproxy_test.py latency pre ${{ matrix.os == 'windows-latest' && 'build/Release/echo_test.exe' || './build/echo_test' }}
        python tests/handshake/toxiproxy_test.py timeout pre ${{ matrix.os == 'windows-latest' && 'build/Release/echo_test.exe' || './build/echo_test' }}
        python tests/handshake/toxiproxy_test.py reset pre ${{ matrix.os == 'windows-latest' && 'build/Release/echo_test.exe' || './build/echo_test' }}
        python tests/handshake/toxiproxy_test.py bandwidth pre ${{ matrix.os == 'windows-latest' && 'build/Release/echo_test.exe' || './build/echo_test' }}
        python tests/handshake/bad_handshake_toxiproxy_test.py ${{ matrix.os == 'windows-latest' && 'build/Release/echo_test.exe' || './build/echo_test' }}

    - name: Stop background servers
      if: always()
      run: |
        ${{ matrix.os == 'windows-latest' && 'Stop-Process -Name python -Force -ErrorAction SilentlyContinue; Get-Process toxiproxy* -ErrorAction SilentlyContinue | Stop-Process -Force' || 'pkill -f "echo_server\.py" 2>/dev/null || true; pkill -f "listen_only_server\.py" 2>/dev/null || true; pkill -f toxiproxy-server 2>/dev/null || true' }}

    - name: Stop Autobahn
      if: matrix.os == 'ubuntu-latest' && matrix.asan && always()
      run: docker rm -f autobahn
